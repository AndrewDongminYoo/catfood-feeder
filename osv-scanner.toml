# OSV matches this advisory ID; the version and paths are re-evaluation conditions.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 has no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1 and the only fix is minimatch 11.0.1, a major version. Installed paths: eslint@10.13.0 and eslint@10.13.0 > @eslint/config-array@0.23.5 (devDependency); @typescript-eslint/typescript-estree@8.72.1 through typescript-eslint@8.72.1, required by eslint-config-next@16.4.3 (devDependency); and shadcn@4.23.0 > ts-morph@26.0.0 > @ts-morph/common@0.27.0 (production-declared CLI dependency, not development-only). The newest releases, eslint 10.14.0, @eslint/config-array 0.23.5, @typescript-eslint/typescript-estree 8.72.1 and @ts-morph/common 0.29.0, still require minimatch ^10, so no upgrade within reach lifts it. Current source and scripts have no references to minimatch, shadcn or ts-morph, and no declared application or verification command invokes the shadcn CLI. Medium severity, denial of service through globparts amplification. Approved on 2026-11-05. Re-evaluate when @eslint/config-array or @ts-morph/common accepts minimatch 11."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge@4.3.1 has no patched release as of 2026-10-28. Installed paths: shadcn@4.23.0 and shadcn@4.23.0 > @shadcn/registry@0.2.1. These are production-declared CLI dependencies, not development-only. Current src/scripts have no observed shadcn or deepmerge references, and declared application and verification commands do not invoke the CLI. Crafted CLI merge inputs with a null-prototype target still reproduce returned-object prototype poisoning; this issue is accepted, not fixed. The 2026-10-28 user-authorized maintenance scope covers this disposition. Re-evaluate when a patched release appears, either parent changes, an application consumer is added, or untrusted CLI input is introduced."
