# OSV matches this advisory ID; the version and paths are re-evaluation conditions.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 has no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1 and the only fix is minimatch 11.0.1, a major version. Rechecked 2026-11-18: the eslint and typescript-eslint paths now resolve minimatch@11.0.9 (eslint@10.15.0, @eslint/config-array@0.23.6, typescript-eslint@8.73.0), and the only remaining 10.x path is shadcn@4.23.0 > ts-morph@26.0.0 > @ts-morph/common@0.27.0 (production-declared CLI dependency, not development-only). @ts-morph/common 0.29.1 accepts minimatch ^11.0.1, but shadcn 4.23.0, the newest release, still requires ts-morph ^26.0.0, so no upgrade within reach lifts it. Current source and scripts have no references to minimatch, shadcn or ts-morph, and no declared application or verification command invokes the shadcn CLI. Medium severity, denial of service through globparts amplification. Approved on 2026-11-05. Re-evaluate when shadcn accepts ts-morph 28 or later."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
reason = "picomatch@2.3.2 and picomatch@4.0.7 have no patched release as of 2026-11-18. GitHub advisory data reports no first patched version for the affected range <= 4.0.7, and npm view picomatch versions ends at 4.0.7. Reachability evidence: pnpm why picomatch --prod shows only shadcn@4.23.0 paths (fast-glob@3.3.3 > micromatch@4.0.8 via @shadcn/registry@0.2.1 and @ts-morph/common@0.27.0; @dotenvx/dotenvx@1.75.1 and fdir@6.5.0), and the app imports shadcn only as CSS (shadcn/tailwind.css). Other paths are devDependencies (eslint-config-next, typescript-eslint, knip, vite, vitest). A pnpm build trace in .next names no lockfile picomatch, micromatch, fast-glob, dotenvx or shadcn file; Next.js's vendored copy in next/dist/compiled/picomatch only matches images patterns from next.config, and images.unoptimized is true. Re-evaluate before passing user-supplied glob patterns to any tool. Approved on 2026-11-18. Remove when a picomatch release outside the affected range is available."
