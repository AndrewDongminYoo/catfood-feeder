name: db-tests

# pgTAP suites in supabase/tests depend only on the migrations, so run them
# when either the SQL or this workflow changes. A local `supabase db start`
# applies every migration to an ephemeral Postgres; no secrets are involved.
on:
  pull_request:
    paths:
      - supabase/**
      - .github/workflows/db-tests.yml
  push:
    branches: [main]
    paths:
      - supabase/**
      - .github/workflows/db-tests.yml

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      - name: Start local Postgres (applies migrations)
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
