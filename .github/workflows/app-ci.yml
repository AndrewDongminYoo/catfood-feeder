name: app-ci

on:
  pull_request:
    paths:
      - .github/workflows/app-ci.yml
      - src/**
      - scripts/**
      - public/**
      - .env.example
      - components.json
      - eslint.config.mjs
      - next.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - postcss.config.ts
      - tsconfig.json
      - vercel.json
      - vitest.config.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/app-ci.yml
      - src/**
      - scripts/**
      - public/**
      - .env.example
      - components.json
      - eslint.config.mjs
      - next.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - postcss.config.ts
      - tsconfig.json
      - vercel.json
      - vitest.config.ts

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
