name: app-ci

on:
  pull_request:
    paths:
      - .github/workflows/app-ci.yml
      - src/**
      - scripts/**
      - public/**
      - .env.example
      - components.json
      - eslint.config.mjs
      - next.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - postcss.config.ts
      - tsconfig.json
      - vercel.json
      - vitest.config.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/app-ci.yml
      - src/**
      - scripts/**
      - public/**
      - .env.example
      - components.json
      - eslint.config.mjs
      - next.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - postcss.config.ts
      - tsconfig.json
      - vercel.json
      - vitest.config.ts

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
